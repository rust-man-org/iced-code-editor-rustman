name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxi-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libdbus-1-dev \
            pkg-config \
            cmake \
            build-essential \
            fonts-noto-cjk

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test
